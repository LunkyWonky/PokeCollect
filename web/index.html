<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokémon TCG Collection</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Pokémon TCG Collection</h1>

  <form id="card-form">
    <input type="text" name="name" placeholder="Card Name" required>
    <input type="text" name="setName" placeholder="Set Name" required>
    <input type="number" name="setID" placeholder="Set ID" required>
    <input type="number" name="quantity" placeholder="Quantity" required>
    <input type="number" step="0.01" name="price" placeholder="Market Price" required>
    <label>
      Holo:
      <input type="checkbox" name="holo">
    </label>
    <input type="text" name="promo" placeholder="Promo Type (optional)">
    <button type="submit">Add Card</button>
  </form>

  <h2>Current Collection</h2>
  <table id="collection-table" border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Set</th>
        <th>Holo</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Promo</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="js/main.js"></script>
</body>
</html>
